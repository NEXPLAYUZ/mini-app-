<head>
<meta charset="UTF-8">

<title>ML Diamonds</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#120a0c;color:#fff;font-family:-apple-system,Helvetica,Arial,sans-serif;padding:14px 14px 130px}
.head{display:flex;align-items:center;gap:12px;background:#1d1215;border:1px solid #3a1c22;border-radius:16px;padding:12px;margin-bottom:14px}
.head img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#2a161b}
.head b{font-size:17px;display:block}
.head span{font-size:12px;color:#b8a3a7}
.lbl{font-size:12px;color:#b8a3a7;margin:12px 0 6px;letter-spacing:.5px}
input{width:100%;background:#1d1215;border:1px solid #3a1c22;border-radius:12px;color:#fff;font-size:16px;padding:13px}
input:focus{outline:none;border-color:#e11d2e}
.row{display:flex;gap:10px}
.row>div{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk{position:relative;display:flex;align-items:center;gap:10px;background:#1d1215;border:1px solid #3a1c22;border-radius:14px;padding:10px;color:#fff;cursor:pointer;min-height:84px}
.pk img{width:54px;height:54px;object-fit:contain;flex:none}
.pk .t{min-width:0}
.pk .n{font-size:16px;font-weight:700;line-height:1.2}
.pk .n.s{font-size:14px}
.pk .p{font-size:13px;color:#ff5a68;margin-top:5px}
.pk.hit{border-color:#a8742a;background:#241a14}
.pk.hit .p{color:#ffb84d}
.tag{position:absolute;top:6px;right:6px;background:#e0922b;color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:2px 6px}
.pk.sel{border-color:#e11d2e;background:#3a141a;box-shadow:0 0 0 2px #e11d2e inset}
.bar{position:fixed;left:0;right:0;bottom:0;background:#170d10;border-top:1px solid #3a1c22;padding:12px 14px 22px;display:flex;align-items:center;gap:12px}
.tot{flex:1}
.tot span{font-size:11px;color:#b8a3a7;display:block}
.tot b{font-size:18px}
.buy{background:#e11d2e;color:#fff;border:0;border-radius:14px;font-size:16px;font-weight:700;padding:14px 22px}
.buy:disabled{opacity:.5}
</style>
</head>

var sel = null;

function fmt(x){ return String(x).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function msg(t){ if (tg && tg.showAlert) tg.showAlert(t); else alert(t); }

function render(){
  var h = "";
  for (var i = 0; i < P.length; i++) {
    var k = P[i];
    h += '<div class="pk' + (k.hit ? ' hit' : '') + (sel === k.id ? ' sel' : '') + '" onclick="pick(\'' + k.id + '\')">';
    if (k.hit) h += '<span class="tag">HIT</span>';
    h += '<img src="' + IC[k.id] + '" alt="">';
    h += '<div class="t"><div class="n' + (k.d ? '' : ' s') + '">' + k.n + (k.d ? ' \uD83D\uDC8E' : '') + '</div>';
    h += '<div class="p">' + fmt(k.p) + " so'm</div></div></div>";
  }
  document.getElementById("grid").innerHTML = h;
  var cur = null;
  for (var j = 0; j < P.length; j++) { if (P[j].id === sel) cur = P[j]; }
  document.getElementById("tot").textContent = (cur ? fmt(cur.p) : "0") + " so'm";
}

function pick(id){ sel = id; render(); }

async function buy(){
  var uid = document.getElementById("uid").value.trim();
  var zone = document.getElementById("zone").value.trim();
  if (!/^\d{5,14}$/.test(uid)) { msg("User ID ni to'g'ri kiriting."); return; }
  if (!/^\d{3,7}$/.test(zone)) { msg("Server ID ni to'g'ri kiriting."); return; }
  if (!sel) { msg("Avval mahsulotni tanlang."); return; }
  var b = document.getElementById("buy");
  b.disabled = true;
  try {
    var r = await fetch(API + "/api/order_ml", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({initData: tg ? tg.initData : "", pack: sel, uid: uid, zone: zone})
    });
    var d = await r.json();
    if (d.ok) { msg("Buyurtma qabul qilindi. Tez orada yetkaziladi."); }
    else { msg(d.error || "Xatolik yuz berdi."); }
  } catch (e) {
    msg("Internet xatosi. Qayta urinib ko'ring.");
  }
  b.disabled = false;
}

render();
