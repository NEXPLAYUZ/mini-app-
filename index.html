<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mening Donate</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1115;
    color: #fff;
    font-family: -apple-system, Arial, sans-serif;
    padding: 16px;
    padding-bottom: 40px;
  }
  .hello { font-size: 20px; font-weight: 700; color: #34d399; margin: 8px 0 16px; }
  .card {
    background: #1a1c22;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .row { display: flex; justify-content: space-between; align-items: flex-end; }
  .small { color: #8b8f99; font-size: 14px; }
  .big { font-size: 32px; font-weight: 700; margin-top: 4px; }
  .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .menu button {
    background: #1a1c22; color: #fff; border: none;
    border-radius: 16px; padding: 14px 4px; font-size: 14px;
  }
  h2 { font-size: 20px; margin: 10px 0 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .service {
    background: #1a1c22; border: none; color: #fff;
    border-radius: 18px; padding: 18px 10px; text-align: center;
  }
  .service .icon { font-size: 36px; margin-bottom: 8px; }
  .service b { display: block; font-size: 16px; }
  .service span { color: #8b8f99; font-size: 13px; }
</style>
</head>
<body>

<div class="hello" id="hello">Salom!</div>

<div class="card">
  <div class="row">
    <div>
      <div class="small">Joriy balans</div>
      <div class="big">0 <span class="small">so'm</span></div>
    </div>
    <div style="text-align:right">
      <div class="small">Buyurtma</div>
      <div style="font-size:20px;font-weight:700">0</div>
    </div>
  </div>
</div>

<div class="menu">
  <button onclick="soon('To‘ldirish')">To'ldirish</button>
  <button onclick="soon('Tarix')">Tarix</button>
  <button onclick="soon('Yordam')">Yordam</button>
</div>

<h2>Xizmatlar</h2>
<div class="grid">
  <button class="service" onclick="soon('PUBG UC')">
    <div class="icon">🎯</div><b>PUBG UC</b><span>PUBG Mobile</span>
  </button>
  <button class="service" onclick="soon('ML Diamonds')">
    <div class="icon">💎</div><b>ML Diamonds</b><span>Mobile Legends</span>
  </button>
  <button class="service" onclick="soon('Telegram Premium')">
    <div class="icon">⭐</div><b>Premium</b><span>Telegram</span>
  </button>
  <button class="service" onclick="soon('Telegram Stars')">
    <div class="icon">🌟</div><b>Stars</b><span>Telegram</span>
  </button>
  <button class="service" onclick="soon('Telegram Gifts')">
    <div class="icon">🎁</div><b>Gifts</b><span>Telegram</span>
  </button>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user && user.first_name) {
      document.getElementById('hello').textContent = 'Salom, ' + user.first_name + '!';
    }
  }
  function soon(name) {
    const text = name + ' bo‘limi tez orada ishga tushadi.';
    if (tg && tg.showAlert) { tg.showAlert(text); } else { alert(text); }
  }
</script>

</body>
</html>
