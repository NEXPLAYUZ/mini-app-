<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PUBG UC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px 16px 130px;background:#12080a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1{font-size:20px;text-align:center;margin:4px 0 16px}
.hero{position:relative;overflow:hidden;background:#1e0f12;border:1px solid #3a1a1f;border-radius:18px;padding:18px}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:#3a1218}
.tag{color:#ff4d4d;font-size:12px;font-weight:700;letter-spacing:1.5px}
.hero h2{margin:6px 0;font-size:22px;position:relative}
.hero p{margin:0;color:#b89a9f;font-size:14px;position:relative}
.lbl{color:#ff4d4d;font-size:12px;font-weight:700;letter-spacing:1.5px;margin:22px 4px 10px}
.idbox{display:flex;align-items:center;gap:10px;background:#1e0f12;border:1px solid #3a1a1f;border-radius:14px;padding:0 14px}
.idbox svg{flex:none;color:#b89a9f}
.idbox input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:17px;padding:16px 0;min-width:0}
.idbox input::placeholder{color:#8a7075}
.err{color:#ff6b6b;font-size:13px;margin:8px 4px 0;min-height:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pk{background:#1e0f12;border:2px solid transparent;border-radius:16px;padding:14px 4px;text-align:center;cursor:pointer}
.pk svg{color:#b89a9f}
.pk b{display:block;font-size:20px;margin-top:6px}
.pk span{color:#b89a9f;font-size:13px}
.pk.on{border-color:#ff3b3b;background:#2a1014}
.pk.on svg{color:#ff4d4d}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#12080a;border-top:1px solid #3a1a1f;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.bar small{color:#b89a9f;font-size:12px;letter-spacing:1px}
.bar div b{display:block;font-size:20px;margin-top:2px}
.buy{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#ff3b3b,#c4161c);color:#fff;border:none;border-radius:16px;padding:16px 22px;font-size:17px;font-weight:700;cursor:pointer}
.note{text-align:center;color:#8a7075;font-size:12px;margin-top:16px}
</style>
</head>
<body>
<h1>PUBG UC</h1>

<div class="hero">
  <div class="tag">OFFICIAL PARTNER</div>
  <h2>PUBG Mobile</h2>
  <p>Bir zumda UC to'ldirish xizmati.</p>
</div>

<div class="lbl">O'YINCHI MA'LUMOTLARI</div>
<div class="idbox">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
  <input id="pid" type="text" inputmode="numeric" placeholder="Player ID" maxlength="14">
</div>
<div class="err" id="err"></div>

<div class="lbl" style="margin-top:12px">PAKETNI TANLANG</div>
<div class="grid" id="grid"></div>
<div class="note">Narxlar namuna. To'lov tizimi hali ulanmagan.</div>

<div class="bar">
  <div><small>JAMI</small><b id="total">0 UZS</b></div>
  <button class="buy" id="buy">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M16 11.5h.01M18.5 14h.01"/></svg>
    Xarid qilish
  </button>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.BackButton.show(); tg.BackButton.onClick(function(){ location.href = "index.html"; }); } catch(e){}
}

// Paketlar: [UC, narx (so'm)]. Narxlarni shu yerda o'zgartirasiz.
const PACKS = [
  [60,12000],[120,24000],[180,36000],
  [240,48000],[325,60000],[385,71000],
  [445,82000],[505,93000],[660,120000],
  [720,131000],[780,142000],[985,179000],
  [1320,240000],[1800,300000],[2125,360000],
  [2460,415000],[3850,640000],[4510,750000],
  [5650,940000],[8100,1350000],[11950,1990000],
  [24300,4050000],[81000,13500000]
];

const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const $ = id => document.getElementById(id);
const icon = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M16 11.5h.01M18.5 14h.01"/></svg>';
let sel = 0;

function render() {
  $("grid").innerHTML = PACKS.map(function(p, i) {
    return '<div class="pk' + (i === sel ? ' on' : '') + '" data-i="' + i + '">' + icon + '<b>' + p[0] + '</b><span>UC</span></div>';
  }).join("");
  $("total").textContent = fmt(PACKS[sel][1]) + " UZS";
  document.querySelectorAll(".pk").forEach(function(el) {
    el.onclick = function() { sel = parseInt(el.dataset.i, 10); render(); };
  });
}
render();

$("buy").onclick = function() {
  const id = $("pid").value.replace(/\D/g, "");
  if (id.length < 5) { $("err").textContent = "Player ID ni to'g'ri kiriting"; return; }
  $("err").textContent = "";
  const msg = PACKS[sel][0] + " UC, ID: " + id + "\nTo'lov tizimi hali ulanmagan (namuna).";
  if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg);
};
  // --- Narxlar Worker bilan bir xil ---
PACKS.length = 0;
[[60,13000],[120,26000],[180,39000],[240,52000],[325,60000],[385,73000],
 [445,86000],[505,99000],[660,120000],[720,133000],[780,146000],[985,180000],
 [1320,240000],[1800,305000],[2125,365000],[2460,425000],[3850,580000],
 [4510,700000],[5650,885000],[8100,1200000],[11950,1780000],[24300,3600000],
 [81000,12500000]].forEach(function (p) { PACKS.push(p); });
sel = 0;
render();

// --- Xarid qilish tugmasi Worker'ga ulanadi ---
$("buy").onclick = async function () {
  const btn = $("buy");
  const id = $("pid").value.replace(/\D/g, "");
  if (id.length < 5) { $("err").textContent = "Player ID noto'g'ri"; return; }
  $("err").textContent = "";
  if (!tg || !tg.initData) {
    $("err").textContent = "Iltimos, Telegram ichida oching";
    return;
  }
  const old = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = "Yuborilmoqda...";
  try {
    const r = await fetch("https://nexplay-bot.rowzn43.workers.dev/api/order_uc", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg.initData, uc: PACKS[sel][0], pid: id })
    });
    const d = await r.json();
    if (d.ok) {
      tg.showAlert(PACKS[sel][0] + " UC buyurtmasi qabul qilindi!\nBalans: " + fmt(d.balance) + " so'm");
    } else if (d.error === "balance") {
      $("err").textContent = "Hisobingizda mablag' yetarli emas. Avval hisobni to'ldiring.";
    } else {
      $("err").textContent = "Xatolik: " + (d.error || "noma'lum");
    }
  } catch (e) {
    $("err").textContent = "Tarmoq xatosi. Qayta urinib ko'ring.";
  }
  btn.disabled = false;
  btn.innerHTML = old;
};

</script>
</body>
</html>
