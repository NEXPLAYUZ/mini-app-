<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarix</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#0d1017;color:#fff;font-family:-apple-system,Arial,sans-serif;padding:16px}
h2{margin:8px 0 16px}
.back{background:#1a1c22;color:#fff;border:1px solid #262932;border-radius:12px;padding:10px 16px;font-size:15px;margin-bottom:12px}
.item{background:#1a1c22;border:1px solid #262932;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.amt{font-weight:700;font-size:17px}
.date{color:#8b8f99;font-size:12px;margin-top:4px}
.ok{color:#34d399;font-weight:600}
.no{color:#f87171;font-weight:600}
.empty{color:#8b8f99;text-align:center;margin-top:40px}
</style>
</head>
<body>
<button class="back" onclick="location.href='index.html'">← Orqaga</button>
<h2>To'ldirishlar tarixi</h2>
<div id="list"><div class="empty">Yuklanmoqda...</div></div>
<script>
(async function () {
  var list = document.getElementById("list");
  try {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    if (!tg || !tg.initData) {
      list.innerHTML = '<div class="empty">Bu sahifani Telegram ichida oching.</div>';
      return;
    }
    var r = await fetch("https://nexplay-bot.rowzn43.workers.dev/api/history", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg.initData })
    });
    var d = await r.json();
    if (!d.ok || !d.history || d.history.length === 0) {
      list.innerHTML = '<div class="empty">Hozircha tarix bo\'sh.</div>';
      return;
    }
    list.innerHTML = d.history.map(function (x) {
      var sum = Number(x.a).toLocaleString("ru-RU");
      var date = new Date(x.t).toLocaleString("ru-RU");
      var st = x.s === "ok" ? '<span class="ok">✅ Tasdiqlandi</span>' : '<span class="no">❌ Rad etildi</span>';
      return '<div class="item"><div><div class="amt">+' + sum + " so'm</div><div class=\"date\">" + date + "</div></div>" + st + "</div>";
    }).join("");
  } catch (e) {
    list.innerHTML = '<div class="empty">Xatolik. Qayta urinib ko\'ring.</div>';
  }
})();
</script>
</body>
</html>
